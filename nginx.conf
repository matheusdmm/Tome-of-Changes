limit_req_zone $binary_remote_addr zone=site_per_ip:10m rate=5r/s;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    limit_req zone=site_per_ip burst=30 nodelay;
    limit_req_status 429;

    error_page 404 /404.html;
    location = /404.html { internal; }

    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
    location = /index.html { add_header Cache-Control "no-cache"; }

    location ~ ^/(conditions|privacy|favorites|whats-new|attribution|browse)$ {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location ~ ^/browse/(Spell|Condition|Feat|Creature|MagicItem|Race)$ {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location ~ ^/compare/(Spell|Condition|Feat|Creature|MagicItem|Race)/.*$ {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/(robots\.txt|sitemap\.xml|manifest\.json|favicon\.svg|favicon\.ico|favicon-96x96\.png|apple-touch-icon\.png|web-app-manifest-(192x192|512x512)\.png|og-image\.png)$ {
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location / { return 404; }
}
